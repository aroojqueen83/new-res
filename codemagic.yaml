# Codemagic configuration file
# Place this at the root of your repository

workflows:
  android-release-apk:
    name: Build Android Release APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      groups:
        - android_signing # Ensure this matches your Codemagic UI group name
      vars:
        PACKAGE_NAME: "com.example.yourapp"
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - target: main
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Android release APK
        script: |
          # Navigate into the subfolder where gradlew exists
          cd android 
          # Ensure execution permissions for gradlew on the CI runner
          chmod +x gradlew 
          # Run the release build
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
