# Codemagic configuration file
# Place this at the root of your repository

workflows:
  android-release-apk:
    name: Build Android Release APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      groups:
        - android_signing 
      vars:
        PACKAGE_NAME: "com.example.yourapp"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'   
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          # FIXED: Writing directly to root folder instead of /android/
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android release APK
        script: |
          # FIXED: Removed 'cd android' since gradlew is at the root
          chmod +x gradlew 
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
