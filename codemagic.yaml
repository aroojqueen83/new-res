workflows:
  android-release-apk:
    name: Build Android Release APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      groups:
        - android_signing # Create this group in Codemagic UI to hold your keystore variables
      vars:
        PACKAGE_NAME: "com.example.yourapp"
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - target: main
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Flutter APK Release
        script: |
          # Use --split-per-abi if you want smaller, device-specific APKs
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*release.apk
